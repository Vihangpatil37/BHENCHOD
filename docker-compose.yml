name: scpr

services:
  mongo:
    image: mongo:8
    container_name: scpr-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scpr-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: wget -q -O /dev/null http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/scpr
      - PORT=3000
    volumes:
      - type: bind
        source: .
        target: /app/catalogs
        read_only: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scpr-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
