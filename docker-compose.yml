services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scpr-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scpr-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
